<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <rect width="1200" height="675" fill="#12131c"/>
  <rect x="1" y="1" width="1198" height="673" fill="none" stroke="#25283b" stroke-width="2"/>
  
  <line x1="60" y1="0" x2="60" y2="675" stroke="#1d2030" stroke-width="1"/>
  <line x1="1140" y1="0" x2="1140" y2="675" stroke="#1d2030" stroke-width="1"/>
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#1d2030" stroke-width="1"/>
  <line x1="0" y1="595" x2="1200" y2="595" stroke="#1d2030" stroke-width="1"/>

  <text x="90" y="52" fill="#717a9e" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="2">SYS_SPEC :: WORKWAVE_RECRUITMENT_STACK</text>
  <text x="960" y="52" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="14" letter-spacing="1">SECURITY: OAuth2 + RBAC</text>

  <rect x="100" y="130" width="480" height="420" fill="#1a1d2e" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
  <text x="130" y="165" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">01. SECURITY &amp; AUTH</text>
  <text x="130" y="195" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">Spring Security + OAuth2</text>

  <rect x="130" y="230" width="420" height="80" fill="#0d0e15" stroke="#25283b" stroke-width="1" rx="4"/>
  <text x="150" y="260" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="16" font-weight="700">Role-Based Access Control (RBAC)</text>
  <text x="150" y="285" fill="#a4b0be" font-family="JetBrains Mono, monospace" font-size="12">Recruiter Portal / Candidate Dashboard</text>

  <rect x="130" y="330" width="420" height="190" fill="#0d0e15" stroke="#25283b" stroke-width="1" rx="4"/>
  <text x="150" y="365" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="12">REST API ENDPOINTS</text>
  <text x="150" y="395" fill="#a4b0be" font-family="JetBrains Mono, monospace" font-size="13">POST /api/v1/jobs/post</text>
  <text x="150" y="425" fill="#a4b0be" font-family="JetBrains Mono, monospace" font-size="13">GET  /api/v1/jobs/search?filter=backend</text>
  <text x="150" y="455" fill="#a4b0be" font-family="JetBrains Mono, monospace" font-size="13">POST /api/v1/applications/submit</text>
  <text x="150" y="485" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="13">GET  /api/v1/recommendations/matches</text>

  <rect x="620" y="130" width="480" height="200" fill="#1a1d2e" stroke="#2563eb" stroke-width="1.5" rx="6"/>
  <text x="650" y="165" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="12">02. CACHING &amp; INDEXING</text>
  <text x="650" y="195" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="20" font-weight="700">Redis In-Memory Search Engine</text>
  <text x="650" y="235" fill="#a4b0be" font-family="JetBrains Mono, monospace" font-size="13">Key-Value job posting cache for low latency search queries and high concurrency applicant filtering.</text>
  <text x="650" y="275" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="16" font-weight="700">Response Time: &lt; 15ms</text>

  <circle cx="1110" cy="52" r="5" fill="#38bdf8"/>
</svg>

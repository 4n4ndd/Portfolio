  <text x="125" y="195" fill="#ffffff" font-family="Space Grotesk, sans-serif" font-size="18" font-weight="700">SVD Matrix Factorization</text>

  <g stroke="#25283b" stroke-width="1">
    <line x1="125" y1="225" x2="415" y2="225"/>
    <line x1="125" y1="265" x2="415" y2="265"/>
    <line x1="125" y1="305" x2="415" y2="305"/>
    <line x1="125" y1="345" x2="415" y2="345"/>

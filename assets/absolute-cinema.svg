  <text x="145" y="512" fill="#c084fc" font-family="JetBrains Mono, monospace" font-size="13" font-weight="700">RMSE: 0.864 / MAE: 0.671</text>

  <rect x="470" y="130" width="630" height="250" fill="#1a1d2e" stroke="#38bdf8" stroke-width="1.5" rx="6"/>
